<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobile Frame — record a tool in 9:16</title>
<style>
  html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:"IBM Plex Mono",ui-monospace,monospace}
  .stage{height:100vh;display:grid;place-items:center}
  /* pure black stage + a faint WHITE hairline = the crop guide (black & white, auto-removed in editing) */
  .phone{width:402px;height:714px;border-radius:0;overflow:hidden;background:#000;
    box-shadow:0 0 0 3px #ffffff;transform-origin:center}
  .phone iframe{width:402px;height:714px;border:0;display:block;background:#000}
  .hint{position:fixed;top:10px;left:0;right:0;text-align:center;color:#7c7c86;font-size:12px;letter-spacing:.02em;pointer-events:none;transition:opacity .4s}
  .hint b{color:#e6e6ea}
  .hint.hide{opacity:0}
</style>
</head>
<body>
  <div class="hint" id="hint"><b>F11</b> fullscreen &nbsp;·&nbsp; the thin white frame is the crop guide (auto-removed) &nbsp;·&nbsp; record full screen &nbsp;·&nbsp; <b>H</b> hides this line</div>
  <div class="stage"><div class="phone" id="phone"><iframe id="f" title="tool" allow="clipboard-write"></iframe></div></div>
<script>
  var tool = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim() || '/';
  if (!tool.startsWith('/')) tool = '/' + tool;
  var frame = document.getElementById('f');
  // same-origin: trim the site's page gutter so tool content sits flush & consistent across tools
  frame.addEventListener('load', function () {
    try {
      var doc = frame.contentDocument;
      var st = doc.createElement('style');
      st.textContent = '.container{padding-left:12px!important;padding-right:12px!important}' +
                       '.main{padding-left:12px!important;padding-right:12px!important}';
      doc.head.appendChild(st);
    } catch (e) {}
  });
  frame.src = tool;
  function fit(){
    var s = Math.min((window.innerHeight - 36) / 714, (window.innerWidth - 24) / 402);
    s = Math.max(0.4, Math.min(s, 2.2));
    document.getElementById('phone').style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();
  window.addEventListener('hashchange', function(){ location.reload(); });
  var hint = document.getElementById('hint');
  window.addEventListener('keydown', function(e){ if (e.key === 'h' || e.key === 'H') hint.classList.toggle('hide'); });
  setTimeout(function(){ hint.classList.add('hide'); }, 4500);   // auto-hide so it never interferes with the crop
</script>
</body>
</html>
